<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syslog Lens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#e9edf1;--panel:#f7f9fb;--ink:#141a22;--mute:#5d6877;--line:#d5dbe3;--hi:#ffffff;
--s0:#d1006f;--s1:#e0245e;--s2:#f0463a;--s3:#f97316;--s4:#e5a800;--s5:#12a6bd;--s6:#4c8dff;--s7:#8a93a3;
--accent:#2f5fd8;--accent-hover:#2449b0;--accent-ink:#ffffff;--accent-disabled-bg:#c7cedb;--accent-disabled-ink:#6b7484;
--sel-bg-alpha:20%;--sel-border-alpha:60%;--inc-sel-bg:color-mix(in srgb,var(--accent) 12%,var(--panel));--inc-sel-border:color-mix(in srgb,var(--accent) 38%,transparent);
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131a;--panel:#151c26;--ink:#e4e9f0;--mute:#9aa5b6;--line:#242d3a;--hi:#1b2431;--accent:#3b68d9;--accent-hover:#5580e8;--accent-disabled-bg:#2a3242;--accent-disabled-ink:#6c7788;--sel-bg-alpha:32%;--sel-border-alpha:75%;--inc-sel-bg:color-mix(in srgb,var(--accent) 20%,var(--panel));--inc-sel-border:color-mix(in srgb,var(--accent) 45%,transparent)}}
:root[data-theme="dark"]{--bg:#0e131a;--panel:#151c26;--ink:#e4e9f0;--mute:#9aa5b6;--line:#242d3a;--hi:#1b2431;--accent:#3b68d9;--accent-hover:#5580e8;--accent-disabled-bg:#2a3242;--accent-disabled-ink:#6c7788;--sel-bg-alpha:32%;--sel-border-alpha:75%;--inc-sel-bg:color-mix(in srgb,var(--accent) 20%,var(--panel));--inc-sel-border:color-mix(in srgb,var(--accent) 45%,transparent)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--s6);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;height:3px;margin-top:2px;background:linear-gradient(90deg,var(--s0),var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6),var(--s7))}
.badge{color:var(--mute);font-size:12.5px}.sp{flex:1}
.hdr-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{padding:6px 12px;border:1px solid color-mix(in srgb,var(--ink) 20%,var(--line));border-radius:6px;background:var(--hi);color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--mute);background:color-mix(in srgb,var(--ink) 6%,var(--hi))}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.btn:disabled{opacity:.55;cursor:default;color:var(--mute)}
.btn:disabled:hover{border-color:color-mix(in srgb,var(--ink) 20%,var(--line));background:var(--hi)}
.btn:focus-visible{outline:2px solid var(--s6);outline-offset:2px}
.icon{width:15px;height:15px;flex:none}
/* Secondary: "Open another log" - higher-contrast outline than the base .btn */
.btn-outline{border-color:color-mix(in srgb,var(--ink) 45%,var(--line));font-weight:600}
.btn-outline:hover{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,var(--hi))}
/* Primary: the report/download button - filled accent, clear hover/focus/disabled states */
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:7px 14px}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-primary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn-primary .chev{width:10px;height:10px;margin-left:-2px;opacity:.9}
.btn-primary:disabled{background:var(--accent-disabled-bg);color:var(--accent-disabled-ink);border-color:var(--accent-disabled-bg);opacity:1}
.btn-primary:disabled:hover{background:var(--accent-disabled-bg)}
/* Utilities: timezone + theme toggles - quiet, compact ghost/icon buttons */
.hdr-utils{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid transparent;background:transparent;color:var(--mute);border-radius:6px;font-weight:500}
.btn-ghost:hover{color:var(--ink);background:var(--hi)}
.btn-ghost.icon-only{padding:6px}
/* Sun/moon swap on the theme toggle, mirroring the same light/dark gating used for --bg etc. */
/* Moon is a filled glyph (vs. the clock's stroked outline); scale/lighten it so its visual size and weight match */
#th .i-moon{transform:scale(.82);opacity:.92}
#th .i-sun{display:none}#th .i-moon{display:inline}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #th .i-sun{display:inline}:root:not([data-theme="light"]) #th .i-moon{display:none}}
:root[data-theme="dark"] #th .i-sun{display:inline}:root[data-theme="dark"] #th .i-moon{display:none}
:root[data-theme="light"] #th .i-sun{display:none}:root[data-theme="light"] #th .i-moon{display:inline}
/* User area: separated from the tools with a subtle divider, compact avatar chip + visible logout */
.hdr-div{width:1px;align-self:stretch;margin:2px 2px;background:var(--line)}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:2px 4px 2px 2px;color:var(--ink);font-size:12.5px}
.user-chip .avatar{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 11px var(--sans);flex:none}
.user-chip .who{display:flex;flex-direction:column;line-height:1.25}
.user-chip .who-name{font-weight:600;color:var(--ink)}
.user-chip .who-emp{color:var(--mute);font-size:11px}
.btn-logout{padding:6px 12px;border:1px solid color-mix(in srgb,var(--ink) 20%,var(--line));color:var(--ink);font-weight:600}
.btn-logout:hover{border-color:var(--s2);color:var(--s2)}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:4px}
.mi{display:block;width:100%;padding:8px 10px;border-radius:6px;font-size:13px}
.mi:hover:not([aria-disabled="true"]){background:var(--hi)}
.mi[aria-disabled="true"]{opacity:.5;cursor:default}
.mi .lbl{display:flex;align-items:center;gap:7px;font-weight:500}
.mi .lbl .icon{color:var(--mute)}
.mi .desc{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;margin-left:22px}
.mi .hint{display:none;color:var(--mute);font-size:11.5px;margin-top:2px;margin-left:22px}
.mi[aria-disabled="true"] .hint{display:block}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#in{flex:1;overflow:auto;display:grid;place-items:center;padding:24px}
.intake{width:min(720px,100%)}
.intake h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;font-weight:600}
.intake p{margin:0 0 20px;color:var(--mute);max-width:56ch}
.drop{display:block;border:1.5px dashed var(--mute);border-radius:10px;padding:34px 20px;text-align:center;background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--s6);background:var(--hi)}
.drop b{display:block;font-size:16px}.drop span{color:var(--mute);font-size:13px}
.or{margin:16px 0 8px;color:var(--mute);font-size:13px}
textarea{width:100%;height:120px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:12.5px/1.5 var(--mono)}
.row{display:flex;gap:10px;margin-top:10px;align-items:center}
.err{color:var(--s2);font-size:13px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:250px max(260px,min(var(--mid,350px),calc(100vw - 640px))) 10px minmax(0,1fr)}
.col{min-height:0;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column}
.col:last-child{border-right:0}
#c1{background:var(--panel)}
.meta{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.meta b{display:block;color:var(--ink);font-size:15px;word-break:break-all}
.chip{display:inline-block;margin-top:6px;padding:1px 8px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:var(--hi);color:var(--ink)}
.sv{position:relative;display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:6px;width:100%;padding:11px 16px 13px 13px;border-left:4px solid transparent}
.sv .num{font:500 15px var(--mono);color:var(--c)}
.sv .ct{font:13px var(--mono);color:var(--mute)}
.sv i{position:absolute;left:16px;bottom:5px;height:3px;border-radius:2px;background:var(--c);opacity:.85}
.sv:hover:not(:disabled):not([aria-pressed="true"]){background:var(--hi)}
.sv[aria-pressed="true"]{background:color-mix(in srgb,var(--c) var(--sel-bg-alpha),var(--panel));box-shadow:inset 4px 0 0 0 var(--c),inset 0 0 0 1px color-mix(in srgb,var(--c) var(--sel-border-alpha),transparent)}
.sv[aria-pressed="true"] span:nth-child(2),.sv[aria-pressed="true"] .ct{font-weight:700;color:var(--ink)}
.sv:disabled{opacity:.55;cursor:default}
.back{display:none;padding:10px 16px;color:var(--s6);border-bottom:1px solid var(--line)}
#q{margin:12px 14px 6px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.inc{display:block;width:100%;padding:11px 16px 11px 13px;border-left:4px solid transparent;border-bottom:1px solid var(--line)}
.inc:hover:not([aria-pressed="true"]){background:var(--hi)}
.inc[aria-pressed="true"]{border-left-color:var(--accent);background:var(--inc-sel-bg);box-shadow:inset 0 0 0 1px var(--inc-sel-border)}
.inc[aria-pressed="true"] .t{font-weight:600;color:var(--ink)}
.inc .t{font-weight:500;overflow-wrap:anywhere}
.inc .m{display:flex;gap:10px;color:var(--mute);font-size:12.5px;margin-top:2px}
.inc .b{margin-top:3px;font-size:12.5px;color:var(--mute)}.inc .b b{font-weight:600}
.empty{padding:28px 20px;color:var(--mute)}
#detail{padding:0 26px 60px;max-width:820px}
#detail h2{margin:4px 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.015em;font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--line);border-radius:3px;font:500 10px var(--mono);letter-spacing:.02em;color:var(--mute);vertical-align:1px;cursor:help}
.raw .tag{user-select:none}
dl.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 22px;margin:18px 0;padding:14px 0;border-block:1px solid var(--line)}
dl.sum dt{color:var(--mute);font-size:12.5px}dl.sum dd{margin:0;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.sub{color:var(--mute);font:13px var(--mono)}.story{margin:0;max-width:66ch}.note{color:var(--mute);font-size:12.5px;margin:4px 0 0}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin:6px 0 4px}
.spark i{flex:1;background:var(--c);opacity:.8;min-height:2px;border-radius:1px}
.cap{color:var(--mute);font-size:12.5px;margin-bottom:22px}
ol.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
ol.tl li{position:relative;padding-left:16px}
ol.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.gap{display:block;font:12px var(--mono);color:var(--mute);margin-left:-16px;padding-bottom:2px}
.tl li.dim{opacity:.62}.tl .ev{font:500 12px var(--mono);color:var(--c);margin-left:8px}
.tl time{font:12.5px var(--mono);color:var(--mute)}
.tl p{margin:1px 0 0;overflow-wrap:anywhere}
.tl details{margin-top:2px}
.tl summary{cursor:pointer;color:var(--mute);font-size:12px;width:max-content}
.tl code{display:block;margin-top:4px;padding:8px 10px;background:var(--hi);border:1px solid var(--line);border-radius:6px;font:12px/1.5 var(--mono);overflow-wrap:anywhere}
.dh{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 0 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 2px}
.tgl{padding:4px 10px;font-size:12.5px;white-space:nowrap;flex:none}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{display:flex;align-items:center;gap:9px;padding:11px 0;cursor:pointer;list-style:none;font-size:15px;font-weight:600;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"";flex:none;width:7px;height:7px;margin:0 3px 2px 2px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .15s}
.sec[open]>summary::before{transform:rotate(45deg);margin-bottom:4px}
.sec>summary:hover::before{border-color:var(--ink)}
.sec>summary .cnt{font:400 12.5px var(--mono);color:var(--mute)}
.sec .body{padding:0 0 16px 18px}
.sec dl.sum{display:flex;flex-wrap:wrap;margin:0 0 10px;padding:0;border:0;gap:8px 32px}
.sec dl.sum dd{white-space:nowrap}
.sec dl.sum .wide{flex-basis:100%}.sec dl.sum .wide dd{white-space:normal}
.sec .story{max-width:none}
.sec .spark{height:30px;margin:4px 0 2px}
.sec .cap{margin:0 0 10px}
.sec .body>.cap:last-child{margin-bottom:0}
.raw{margin:0;padding:10px 12px;background:var(--hi);border:1px solid var(--line);border-radius:6px;font:12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.rz{position:relative;cursor:col-resize;touch-action:none;outline:none}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;margin-left:-.5px;background:var(--line);transition:background .15s,width .15s,margin .15s}
.rz:hover::after,.rz:focus-visible::after,.rzing .rz::after{width:2px;margin-left:-1px;background:var(--s6)}
.rz:focus-visible{outline:2px solid var(--s6);outline-offset:-2px}
.rzing,.rzing *{cursor:col-resize!important;user-select:none}
#c2{border-right:0}
@media (max-width:900px){
 .app{grid-template-columns:1fr}.rz{display:none}.col{display:none;border-right:0}.back{display:block}
 .app[data-step="1"] #c1,.app[data-step="2"] #c2,.app[data-step="3"] #c3{display:flex}
 .badge{display:none}#detail{padding:0 16px 50px}
 header{padding:8px 10px}
 .btn-outline .lbltxt,.btn-primary .lbltxt,#tzbtnLabel,.user-chip .who-emp{display:none}
 .btn-primary,.btn-outline{padding:7px 9px}
 .user-chip .who-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .menu{right:0;left:auto;max-width:calc(100vw - 20px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header>
 <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="M17 17l6 6"/><path d="M7 11h8" stroke="var(--s3)"/></svg><div>Syslog Lens<small></small></div></div>
 <span class="badge">Parsed in your browser. Nothing is uploaded.</span><span class="sp"></span>
 <div class="hdr-tools">
  <button class="btn btn-outline" id="newb" hidden aria-label="Open another log"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span class="lbltxt" aria-hidden="true">Open another log</span></button>
  <div class="menuwrap" id="reportWrap">
   <button class="btn btn-primary" id="reportb" type="button" aria-haspopup="menu" aria-expanded="false" disabled aria-label="Download report"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg><span class="lbltxt" aria-hidden="true">Download report</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
   <div class="menu" id="reportMenu" role="menu" aria-label="Download report" hidden>
    <button class="mi" id="miSummary" role="menuitem" type="button"><span class="lbl"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Log summary (.html)</span><span class="desc">Overview of devices, severities and incidents</span></button>
    <button class="mi" id="miIncident" role="menuitem" type="button" aria-disabled="true"><span class="lbl"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Detailed incident (.html)</span><span class="desc">Full timeline for the selected incident</span><span class="hint" id="miHint">Select an incident first</span></button>
   </div>
  </div>
  <div class="hdr-utils">
   <button class="btn-ghost" id="tzbtn" aria-label="Toggle timestamps between UTC and local time" title="Toggle timestamps between UTC and local time"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span class="lbltxt" id="tzbtnLabel">Local</span></button>
   <button class="btn-ghost icon-only" id="th" aria-label="Toggle light or dark theme" title="Toggle light or dark theme"><svg class="icon i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon i-moon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
  <span class="hdr-div" id="userDiv" hidden></span>
  <span class="user-chip" id="whoami" hidden><span class="sr-only">Signed in as </span><span class="avatar" id="whoAvatar" aria-hidden="true"></span><span class="who"><span class="who-name" id="whoName"></span><span class="who-emp" id="whoEmp"></span></span></span>
  <button class="btn btn-logout" id="logoutb" hidden>Log out</button>
 </div>
</header>

<main id="in"><div class="intake">
 <h1>Find what went wrong in your syslog.</h1>
 <p>Drop a log file or paste raw text. Events are sorted by RFC 5424 severity, grouped into incidents, and laid out on a timeline.</p>
 <label class="drop" id="drop"><b>Drop a .log, .txt or .syslog file here</b><span>or click to choose a file</span><input id="file" type="file" accept=".log,.txt,.syslog" hidden></label>
 <div class="or">Or paste log text</div>
 <textarea id="paste" placeholder="&lt;187&gt;Sep 24 03:12:07 core-sw1 %LINK-3-UPDOWN: Interface GigabitEthernet0/24, changed state to down" spellcheck="false"></textarea>
 <div class="row"><button class="btn go" id="parse">Parse log</button><button class="btn" id="demo">Try a sample log</button><span class="err" id="err"></span></div>
</div></main>

<div class="app" id="app" data-step="1" hidden>
 <section class="col" id="c1"><div class="meta" id="meta"></div><div id="rail"></div></section>
 <section class="col" id="c2"><button class="back" data-to="1">Back to severities</button><input id="q" placeholder="Filter incidents" aria-label="Filter incidents"><div id="list"></div></section>
 <div class="rz" id="rz" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize incident list and detail panes" aria-valuemin="260" aria-valuenow="350"></div>

h1,h2,h3{font-weight:600;letter-spacing:-.01em}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
h3{font-size:14px;margin:16px 0 4px}
table{border-collapse:collapse;width:100%;margin:8px 0 18px;font-size:12.5px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:600}
code,.raw{font-family:var(--mono)}
.raw{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);padding:5px 7px;border-radius:4px;display:block;font-size:11.5px}
.hdr{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.hdr .meta{color:var(--mute);font-size:12.5px;margin-top:6px;line-height:1.7}
.tag{display:inline-block;margin-left:4px;padding:0 5px;border:1px solid var(--line);border-radius:3px;font:500 10px var(--mono);color:var(--mute)}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
footer p{margin:4px 0}
@media print{
 :root{--bg:#ffffff;--panel:#f3f4f6;--ink:#111418;--mute:#5b6472;--line:#d7dbe2;
 --s0:#d1006f;--s1:#e0245e;--s2:#f0463a;--s3:#c2410c;--s4:#a16207;--s5:#0e7f92;--s6:#1d4ed8;--s7:#5b6472}
 body{padding:0 6px}
 th{background:#eef0f3}
}`}
function reportHeaderHTML(type,source,user,rangeStr,genDate){
 /* generatedByLine() already escapes the user-supplied name/employeeNumber
    it interpolates, so it must not be passed through esc() again here -
    doing so would turn "&amp;" into "&amp;amp;" etc. */
 return`<div class="hdr"><h1>Syslog Lens — ${esc(type)}</h1><div class="meta">Source: <code>${esc(source)}</code><br>
${generatedByLine(user)}<br>
Generated: ${esc(reportGenTimestamp(genDate))}<br>
Log time range: ${esc(rangeStr)}</div></div>`;
}
function reportFooterHTML(){
 return`<footer><p>Incident summaries are generated from the parsed log events and describe the observed sequence; they are not a diagnosis or confirmation of root cause.</p>
<p>Syslog Lens parses logs in the browser. Log data is not uploaded.</p></footer>`;
}
function rangeStrOf(evs){return evs.length?`${fmt(evs[0].t)} to ${fmt(evs.at(-1).t)} (${dur(evs.at(-1).t-evs[0].t)})`:'n/a'}
function buildSummaryReport(D,source,user,genDate){
 const incs=[...new Set(D.by.flat())];
 const rangeStr=rangeStrOf(D.ev);
 const devMap=new Map();
 D.ev.forEach(e=>{if(!devMap.has(e.host))devMap.set(e.host,{events:0,incidents:new Set()});devMap.get(e.host).events++});
 /* Every incident's host comes from one of its own events' hosts (see
    describe()'s es[0].host), so it's always already a key in devMap above -
    no existence check needed here. */
 incs.forEach(i=>devMap.get(i.host).incidents.add(i));
 const devRows=[...devMap.entries()].sort((a,b)=>a[0].localeCompare(b[0]))
  .map(([host,v])=>`<tr><td>${esc(host)}</td><td>${v.events}</td><td>${v.incidents.size}</td></tr>`).join('');
 const sevRows=SN.map((n,i)=>{const c=D.ev.filter(e=>e.sev===i).length;return`<tr><td style="color:var(--s${i})">${i}</td><td style="color:var(--s${i})">${esc(n)}</td><td>${c}</td></tr>`}).join('');
 const sortedIncs=[...incs].sort((a,b)=>a.ev[0].t-b.ev[0].t);
 const incRows=sortedIncs.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.host)}</td><td>${esc(i.subject||'')}</td><td>${i.ev.length}</td><td>${dur(i.ev.at(-1).t-i.ev[0].t)}</td><td>${fmt(i.ev[0].t)}</td><td>${fmt(i.ev.at(-1).t)}</td><td>${bd(i,-1)}</td></tr>`).join('');
 const incSummaries=sortedIncs.map(i=>`<div><h3>${esc(i.title)}</h3><p>${i.summary}</p></div>`).join('');
 return`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Syslog Lens — Log Summary — ${esc(source)}</title><style>${reportCSS()}</style></head><body>
${reportHeaderHTML('Log Summary',source,user,rangeStr,genDate)}
<h2>Overview</h2>
<table><tbody>
<tr><th>Total parsed events</th><td>${D.ev.length}</td></tr>
<tr><th>Unparsed lines</th><td>${D.bad.length}</td></tr>
<tr><th>Analysis time range</th><td>${esc(rangeStr)}</td></tr>
</tbody></table>
<h2>Devices</h2>
<table><thead><tr><th>Device</th><th>Events</th><th>Incidents</th></tr></thead><tbody>${devRows||'<tr><td colspan="3">No devices.</td></tr>'}</tbody></table>
<h2>Severity breakdown</h2>
<table><thead><tr><th>#</th><th>Name</th><th>Count</th></tr></thead><tbody>${sevRows}</tbody></table>
<h2>Incidents (${incs.length})</h2>
<table><thead><tr><th>Title</th><th>Device</th><th>Subject</th><th>Events</th><th>Duration</th><th>First seen</th><th>Last seen</th><th>Severities</th></tr></thead><tbody>${incRows||'<tr><td colspan="8">No incidents.</td></tr>'}</tbody></table>
<h2>Incident summaries</h2>
${incSummaries||'<p>No incidents.</p>'}
${reportFooterHTML()}
</body></html>`;
}
function buildIncidentReport(inc,source,user,genDate){
 const e=inc.ev,rangeStr=rangeStrOf(e);
 const sevRows=inc.sevs.map(v=>{const n=e.filter(x=>x.sev===v).length;return`<tr><td style="color:var(--s${v})">${v}</td><td style="color:var(--s${v})">${esc(SN[v])}</td><td>${n}</td></tr>`}).join('');
 const rows=e.map((x,j)=>{const gi=gapInfo(e,j);
  return`<tr><td>${j+1}</td><td>${fmt(x.t)}</td><td>${j?esc(gi.text):'—'}</td><td style="color:var(--s${x.sev})">${x.sev} ${esc(SN[x.sev])} ${gtag(x)}</td><td>${esc(x.proc)}</td><td>${esc(x.msg)}</td><td><code class="raw">${esc(x.raw)}</code></td></tr>`}).join('');
 return`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Syslog Lens — Detailed Incident — ${esc(inc.title)}</title><style>${reportCSS()}</style></head><body>
${reportHeaderHTML('Detailed Incident',source,user,rangeStr,genDate)}
<h2>${esc(inc.title)}</h2>
<table><tbody>
<tr><th>Kind</th><td>${esc(inc.kind)}</td></tr>
<tr><th>Device</th><td>${esc(inc.host)}</td></tr>
<tr><th>Interface / peer / source</th><td>${esc(inc.subject||'')}</td></tr>
<tr><th>Processes</th><td>${esc(inc.proc)}</td></tr>
<tr><th>First seen</th><td>${fmt(e[0].t)}</td></tr>
<tr><th>Last seen</th><td>${fmt(e.at(-1).t)}</td></tr>
<tr><th>Duration</th><td>${dur(e.at(-1).t-e[0].t)}</td></tr>
</tbody></table>
<h2>Summary</h2>
<p>${inc.summary}</p>
<h2>Severity distribution</h2>
<table><thead><tr><th>#</th><th>Name</th><th>Count</th></tr></thead><tbody>${sevRows}</tbody></table>
<h2>Timeline (${e.length} event${e.length===1?'':'s'})</h2>
<table><thead><tr><th>#</th><th>Timestamp</th><th>Gap</th><th>Severity</th><th>Process</th><th>Message</th><th>Raw line</th></tr></thead><tbody>${rows}</tbody></table>
${reportFooterHTML()}
</body></html>`;
}
function downloadHTML(html,filename){
 const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>{try{URL.revokeObjectURL(url)}catch{}},1000);
}
/* Same-origin /api/auth/me lookup, shared by the sign-in banner (see the
   auth IIFE near the bottom of this script) and resolveReportUser() below.
   Deliberately a no-op wherever there's no real server to talk to (file://,
   or the jsdom test loader where fetch is undefined). Returns the user
   object, {unauthorized:true} on a 401, or null on any other failure. */
async function fetchMe(){
 if(typeof fetch!=='function')return null;
 let res;
 try{res=await fetch('/api/auth/me',{credentials:'same-origin'})}
 catch(e){return null} // no server reachable (e.g. file://) - stay silent
 if(!res||res.status===401)return{unauthorized:res&&res.status===401};
 if(!res.ok)return null;
 try{return await res.json()}catch(e){return null}
}
function applyUser(u){
 if(!u||u.unauthorized)return;
 currentUser=u;
 const whoEl=$('#whoami'),logoutBtn=$('#logoutb'),avatarEl=$('#whoAvatar'),nameEl=$('#whoName'),empEl=$('#whoEmp'),divEl=$('#userDiv');
 if(whoEl){
  whoEl.hidden=false;
  whoEl.title=`Signed in as ${u.name} (${u.employeeNumber})`;
  if(avatarEl)avatarEl.textContent=(u.name||'?').trim().charAt(0).toUpperCase();
  if(nameEl)nameEl.textContent=u.name;
  if(empEl)empEl.textContent=`(${u.employeeNumber})`;
 }
 if(divEl)divEl.hidden=false;
 if(logoutBtn)logoutBtn.hidden=false;
}
/* Report builders are pure (see the comment above reportHeaderHTML) and must
   stay that way, so the "who generated this" lookup happens here, one level
   up, right before a download is built - not inside the builders. If a
   report is requested before the sign-in banner's own startup fetch (below)
   has resolved, currentUser can still be null; in that case fetch it now
   rather than let the report fall back to "unknown user" while a real
   session exists. A 401 here means the session has expired/is invalid, so
   redirect to /login exactly like the startup fetch does. Any other failure
   (no server, network error, bad JSON) falls back to null, which the
   builders already render as "Generated by: unknown user".              */
async function resolveReportUser(){
 if(currentUser)return currentUser;
 const u=await fetchMe();
 if(u&&u.unauthorized){location.replace('/login');return{unauthorized:true}}
 applyUser(u);
 return u&&!u.unauthorized?u:null;
}
async function downloadSummaryReport(){
 if(!D)return;
 const user=await resolveReportUser();
 if(user&&user.unauthorized)return; // session expired - already redirecting to /login
 downloadHTML(buildSummaryReport(D,name,user),summaryFilename(name));
}
async function downloadIncidentReport(){
 if(!D||sel==null||cur==null)return;
 const inc=D.by[sel][cur];if(!inc)return;
 const user=await resolveReportUser();
 if(user&&user.unauthorized)return; // session expired - already redirecting to /login
 downloadHTML(buildIncidentReport(inc,name,user),incidentFilename(inc.title));
}
/* Exposed for automated tests only; not used by the UI itself. */
if(typeof window!=='undefined')Object.assign(window.SyslogLens,{fetchMe,resolveReportUser,downloadSummaryReport,downloadIncidentReport});

/* Resizable divider between incident list (#c2) and detail (#c3). Left rail stays fixed.
   The chosen width is remembered in localStorage (best-effort: storage may be
   unavailable in file:// contexts or with cookies/storage blocked, so every
   access is wrapped in try/catch and the app works the same without it). */
const midResize=(()=>{const app=$('#app'),rz=$('#rz'),c2=$('#c2'),MIN=260,RIGHT=380,LEFT=250,GRIP=10,LS_KEY='syslog-lens-mid';
 const max=()=>Math.max(MIN,app.clientWidth-LEFT-GRIP-RIGHT);
 const save=px=>{try{localStorage.setItem(LS_KEY,String(px))}catch{}};
 const sync=()=>{if(rz.offsetParent===null)return;rz.setAttribute('aria-valuemax',max());rz.setAttribute('aria-valuenow',Math.round(c2.getBoundingClientRect().width))};
 const set=(px,persist)=>{const v=Math.round(Math.min(max(),Math.max(MIN,px)));app.style.setProperty('--mid',v+'px');sync();if(persist)save(v)};
 const end=()=>app.classList.remove('rzing');
 rz.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();rz.setPointerCapture(e.pointerId);app.classList.add('rzing');sync()});
 rz.addEventListener('pointermove',e=>{if(app.classList.contains('rzing'))set(e.clientX-c2.getBoundingClientRect().left-GRIP/2,true)});
 rz.addEventListener('pointerup',end);rz.addEventListener('pointercancel',end);
 rz.addEventListener('focus',sync);addEventListener('resize',sync);
 rz.addEventListener('keydown',e=>{const w=c2.getBoundingClientRect().width,st=e.shiftKey?64:16,m={ArrowLeft:w-st,ArrowRight:w+st,Home:MIN,End:max()}[e.key];if(m!=null){e.preventDefault();set(m,true)}});
 /* Applied once the app pane is visible (see load()), so the min/max clamps
    use real layout widths instead of the hidden pane's zero width. */
 function restore(){let raw=null;try{raw=localStorage.getItem(LS_KEY)}catch{}
  if(raw==null)return;const n=Number(raw);if(!Number.isFinite(n))return;set(n,false)}
 return{restore};
})();

$('#detail').onclick=e=>{if(e.target.closest('#tgl')){const any=Object.values(SEC).some(Boolean);document.querySelectorAll('#detail details[data-sec]').forEach(d=>d.open=!any)}};

/* "Generate report" menu: a minimal accessible popup menu (keyboard + Escape,
   aria-expanded/aria-haspopup, aria-disabled on the item that needs an
   incident selected) opening onto the two pure report builders above. */
const reportWrap=$('#reportWrap'),reportBtn=$('#reportb'),reportMenu=$('#reportMenu'),miSummary=$('#miSummary'),miIncident=$('#miIncident');
function syncIncidentMenuItem(){
 const has=!!(D&&sel!=null&&cur!=null&&D.by[sel]&&D.by[sel][cur]);
 miIncident.setAttribute('aria-disabled',has?'false':'true');
}
function closeReportMenu(){reportMenu.hidden=true;reportBtn.setAttribute('aria-expanded','false')}
function openReportMenu(){
 if(reportBtn.disabled)return;
 syncIncidentMenuItem();
 reportMenu.hidden=false;reportBtn.setAttribute('aria-expanded','true');
 miSummary.focus();
}
reportBtn.onclick=()=>{reportMenu.hidden?openReportMenu():closeReportMenu()};
reportMenu.addEventListener('keydown',e=>{
 if(e.key==='Escape'){e.stopPropagation();closeReportMenu();reportBtn.focus();return}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();(document.activeElement===miSummary?miIncident:miSummary).focus()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!reportMenu.hidden){closeReportMenu();reportBtn.focus()}});
document.addEventListener('click',e=>{if(!reportMenu.hidden&&!reportWrap.contains(e.target))closeReportMenu()});
miSummary.onclick=()=>{closeReportMenu();downloadSummaryReport()};
miIncident.onclick=()=>{if(miIncident.getAttribute('aria-disabled')==='true')return;closeReportMenu();downloadIncidentReport()};

$('#file').onchange=e=>readFile(e.target.files[0]);

/* Server-backed auth header (signed-in-as + logout). The token itself lives
   only in an httpOnly cookie set by the server — nothing here stores it.
   Deliberately a no-op wherever there's no real server to talk to (file://,
   or the jsdom test loader where fetch is undefined), so it never affects
   existing tests or the file:// usage flow described in README.md.
   fetchMe()/applyUser() are defined above (near the report download
   handlers) and shared with resolveReportUser(), so a report requested
   before this startup fetch resolves reuses the same lookup instead of
   racing it. */
(function(){
 if(typeof fetch!=='function')return;
 const logoutBtn=$('#logoutb');
 fetchMe().then(u=>{if(u&&u.unauthorized){location.replace('/login');return}applyUser(u)});
 if(logoutBtn)logoutBtn.onclick=async()=>{
  try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch(e){}
  location.replace('/login');
 };
 addEventListener('pageshow',e=>{
  if(!e.persisted)return;
  fetchMe().then(u=>{if(u&&u.unauthorized)location.replace('/login')});
 });
})();
</script>
