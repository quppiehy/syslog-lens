<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syslog Lens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#e9edf1;--panel:#f7f9fb;--ink:#141a22;--mute:#5d6877;--line:#d5dbe3;--hi:#ffffff;
--s0:#d1006f;--s1:#e0245e;--s2:#f0463a;--s3:#f97316;--s4:#e5a800;--s5:#12a6bd;--s6:#4c8dff;--s7:#8a93a3;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131a;--panel:#151c26;--ink:#e4e9f0;--mute:#8a95a6;--line:#242d3a;--hi:#1b2431}}
:root[data-theme="dark"]{--bg:#0e131a;--panel:#151c26;--ink:#e4e9f0;--mute:#8a95a6;--line:#242d3a;--hi:#1b2431}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--s6);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;height:3px;margin-top:2px;background:linear-gradient(90deg,var(--s0),var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6),var(--s7))}
.badge{color:var(--mute);font-size:12.5px}.sp{flex:1}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--hi)}
.btn:hover{border-color:var(--mute)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
[hidden]{display:none!important}
#in{flex:1;overflow:auto;display:grid;place-items:center;padding:24px}
.intake{width:min(720px,100%)}
.intake h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;font-weight:600}
.intake p{margin:0 0 20px;color:var(--mute);max-width:56ch}
.drop{display:block;border:1.5px dashed var(--mute);border-radius:10px;padding:34px 20px;text-align:center;background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--s6);background:var(--hi)}
.drop b{display:block;font-size:16px}.drop span{color:var(--mute);font-size:13px}
.or{margin:16px 0 8px;color:var(--mute);font-size:13px}
textarea{width:100%;height:120px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:12.5px/1.5 var(--mono)}
.row{display:flex;gap:10px;margin-top:10px;align-items:center}
.err{color:var(--s2);font-size:13px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:250px max(260px,min(var(--mid,350px),calc(100vw - 640px))) 10px minmax(0,1fr)}
.col{min-height:0;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column}
.col:last-child{border-right:0}
#c1{background:var(--panel)}
.meta{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.meta b{display:block;color:var(--ink);font-size:15px;word-break:break-all}
.chip{display:inline-block;margin-top:6px;padding:1px 8px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:var(--hi);color:var(--ink)}
.sv{position:relative;display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:6px;width:100%;padding:11px 16px 13px 13px;border-left:3px solid transparent}
.sv .num{font:500 15px var(--mono);color:var(--c)}
.sv .ct{font:13px var(--mono);color:var(--mute)}
.sv i{position:absolute;left:16px;bottom:5px;height:3px;border-radius:2px;background:var(--c);opacity:.85}
.sv:hover:not(:disabled){background:var(--hi)}
.sv[aria-pressed="true"]{border-left-color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.sv:disabled{opacity:.38;cursor:default}
.back{display:none;padding:10px 16px;color:var(--s6);border-bottom:1px solid var(--line)}
#q{margin:12px 14px 6px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.inc{display:block;width:100%;padding:11px 16px 11px 13px;border-left:3px solid transparent;border-bottom:1px solid var(--line)}
.inc:hover{background:var(--hi)}
.inc[aria-pressed="true"]{border-left-color:var(--c);background:var(--hi)}
.inc .t{font-weight:500;overflow-wrap:anywhere}
.inc .m{display:flex;gap:10px;color:var(--mute);font-size:12.5px;margin-top:2px}
.inc .b{margin-top:3px;font-size:12.5px;color:var(--mute)}.inc .b b{font-weight:600}
.empty{padding:28px 20px;color:var(--mute)}
#detail{padding:0 26px 60px;max-width:820px}
#detail h2{margin:4px 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.015em;font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--line);border-radius:3px;font:500 10px var(--mono);letter-spacing:.02em;color:var(--mute);vertical-align:1px;cursor:help}
.raw .tag{user-select:none}
dl.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 22px;margin:18px 0;padding:14px 0;border-block:1px solid var(--line)}
dl.sum dt{color:var(--mute);font-size:12.5px}dl.sum dd{margin:0;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.sub{color:var(--mute);font:13px var(--mono)}.story{margin:0;max-width:66ch}.note{color:var(--mute);font-size:12.5px;margin:4px 0 0}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin:6px 0 4px}
.spark i{flex:1;background:var(--c);opacity:.8;min-height:2px;border-radius:1px}
.cap{color:var(--mute);font-size:12.5px;margin-bottom:22px}
ol.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
ol.tl li{position:relative;padding-left:16px}
ol.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.gap{display:block;font:12px var(--mono);color:var(--mute);margin-left:-16px;padding-bottom:2px}
.tl li.dim{opacity:.62}.tl .ev{font:500 12px var(--mono);color:var(--c);margin-left:8px}
.tl time{font:12.5px var(--mono);color:var(--mute)}
.tl p{margin:1px 0 0;overflow-wrap:anywhere}
.tl details{margin-top:2px}
.tl summary{cursor:pointer;color:var(--mute);font-size:12px;width:max-content}
.tl code{display:block;margin-top:4px;padding:8px 10px;background:var(--hi);border:1px solid var(--line);border-radius:6px;font:12px/1.5 var(--mono);overflow-wrap:anywhere}
.dh{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 0 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 2px}
.tgl{padding:4px 10px;font-size:12.5px;white-space:nowrap;flex:none}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{display:flex;align-items:center;gap:9px;padding:11px 0;cursor:pointer;list-style:none;font-size:15px;font-weight:600;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"";flex:none;width:7px;height:7px;margin:0 3px 2px 2px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .15s}
.sec[open]>summary::before{transform:rotate(45deg);margin-bottom:4px}
.sec>summary:hover::before{border-color:var(--ink)}
.sec>summary .cnt{font:400 12.5px var(--mono);color:var(--mute)}
.sec .body{padding:0 0 16px 18px}
.sec dl.sum{display:flex;flex-wrap:wrap;margin:0 0 10px;padding:0;border:0;gap:8px 32px}
.sec dl.sum dd{white-space:nowrap}
.sec dl.sum .wide{flex-basis:100%}.sec dl.sum .wide dd{white-space:normal}
.sec .story{max-width:none}
.sec .spark{height:30px;margin:4px 0 2px}
.sec .cap{margin:0 0 10px}
.sec .body>.cap:last-child{margin-bottom:0}
.raw{margin:0;padding:10px 12px;background:var(--hi);border:1px solid var(--line);border-radius:6px;font:12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.rz{position:relative;cursor:col-resize;touch-action:none;outline:none}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;margin-left:-.5px;background:var(--line);transition:background .15s,width .15s,margin .15s}
.rz:hover::after,.rz:focus-visible::after,.rzing .rz::after{width:2px;margin-left:-1px;background:var(--s6)}
.rz:focus-visible{outline:2px solid var(--s6);outline-offset:-2px}
.rzing,.rzing *{cursor:col-resize!important;user-select:none}
#c2{border-right:0}
@media (max-width:900px){
 .app{grid-template-columns:1fr}.rz{display:none}.col{display:none;border-right:0}.back{display:block}
 .app[data-step="1"] #c1,.app[data-step="2"] #c2,.app[data-step="3"] #c3{display:flex}
 .badge{display:none}#detail{padding:0 16px 50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header>
 <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="M17 17l6 6"/><path d="M7 11h8" stroke="var(--s3)"/></svg><div>Syslog Lens<small></small></div></div>
 <span class="badge">Parsed in your browser. Nothing is uploaded.</span><span class="sp"></span>
 <button class="btn" id="newb" hidden>Open another log</button>
 <button class="btn" id="tzbtn" aria-label="Toggle timestamps between UTC and local time">Local</button>
 <button class="btn" id="th" aria-label="Toggle light or dark theme">Theme</button>
 <span class="badge" id="whoami" hidden></span>
 <button class="btn" id="logoutb" hidden>Log out</button>
</header>

<main id="in"><div class="intake">
 <h1>Find what went wrong in your syslog.</h1>
 <p>Drop a log file or paste raw text. Events are sorted by RFC 5424 severity, grouped into incidents, and laid out on a timeline.</p>
 <label class="drop" id="drop"><b>Drop a .log, .txt or .syslog file here</b><span>or click to choose a file</span><input id="file" type="file" accept=".log,.txt,.syslog" hidden></label>
 <div class="or">Or paste log text</div>
 <textarea id="paste" placeholder="&lt;187&gt;Sep 24 03:12:07 core-sw1 %LINK-3-UPDOWN: Interface GigabitEthernet0/24, changed state to down" spellcheck="false"></textarea>
 <div class="row"><button class="btn go" id="parse">Parse log</button><button class="btn" id="demo">Try a sample log</button><span class="err" id="err"></span></div>
</div></main>

<div class="app" id="app" data-step="1" hidden>
 <section class="col" id="c1"><div class="meta" id="meta"></div><div id="rail"></div></section>
 <section class="col" id="c2"><button class="back" data-to="1">Back to severities</button><input id="q" placeholder="Filter incidents" aria-label="Filter incidents"><div id="list"></div></section>
 <div class="rz" id="rz" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize incident list and detail panes" aria-valuemin="260" aria-valuenow="350"></div>
 <section class="col" id="c3"><button class="back" data-to="2">Back to incidents</button><div id="detail"></div></section>
</div>

<script>
const SN=['Emergency','Alert','Critical','Error','Warning','Notice','Informational','Debug'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GTITLE='Severity guessed from message keywords; this line had no <PRI> value',gtag=x=>x.guessed?`<span class="tag" title="${esc(GTITLE)}" aria-label="${esc(GTITLE)}">guessed</span>`:'';
const MON='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
let D=null,sel=null,cur=null,name='pasted log';const SEC={sum:true,ov:true,tl:true,raw:false};

function guess(m){return /emerg|panic/i.test(m)?0:/\balert/i.test(m)?1:/crit/i.test(m)?2:/err|fail|denied|\bdown\b/i.test(m)?3:/warn/i.test(m)?4:/notice/i.test(m)?5:/debug/i.test(m)?7:6}
const WIN=300e3,IFR=/\b(?:[A-Za-z]+Ethernet|Ethernet|Vlan|Loopback|Tunnel|Serial|Port-channel|Po|Gi|Te|Fa|Eth)[\d\/.:]+/g,IPR=/\b\d{1,3}(?:\.\d{1,3}){3}\b/g;
/* Lowercase/Juniper/Linux interface names (eth0, ens3, bond0, ge-0/0/0, xe-1/2/0.100, ae0,
   lowercase gi0/1, ...). Gated by a lookbehind requiring "interface " or "port " immediately
   before the name, unlike IFR above which matches its (capitalised, canonical) names anywhere.
   That context requirement is what keeps casual lowercase text such as dhcp01's "via vlan20"
   in network-incidents.log from being read as an interface (see HANDOFF.md). */
const IFR2=/(?<=\b(?:[Ii]nterface|port)[ :]\s*)(?:eth|ens|eno|enp|bond|ge|xe|ae|gi|te|fa|po|fxp|em)-?\d+(?:\/\d+){0,3}(?:\.\d+)?\b/g;
/* IPv6 addresses, full or "::"-compressed. Full form requires exactly 8 hex groups (7 colons),
   which a MAC address (6 groups) or a HH:MM:SS timestamp (3 groups) never has; the compressed
   form requires a literal "::", which neither a MAC address nor a timestamp ever contains
   either. So no extra filtering is needed to keep those two apart from real IPv6 addresses. */
const IP6R=/\b(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}\b|\b(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}(?::[0-9a-fA-F]{1,4})*\b|\b(?:[0-9a-fA-F]{1,4}:){1,7}:(?!\S)|(?<![:.\w])::(?:[0-9a-fA-F]{1,4}:)*[0-9a-fA-F]{1,4}\b|(?<![:.\w])::(?=[^0-9a-fA-F:]|$)/g;
/* Cisco IOS message format, e.g. "000123: *Mar  1 00:00:01.123: %LINK-3-UPDOWN: Interface
   GigabitEthernet0/1, changed state to down" or (with a <PRI> and a hostname added by some
   devices) "<189>45: core-rtr1: Sep 24 03:14:02.114 UTC: %OSPF-5-ADJCHG: ...". Groups: seq
   number, hostname, "*"/"." freshness marker, month, day, time, fractional seconds, timezone
   abbreviation, facility, severity (0-7, same scale as syslog), mnemonic, message. */
const CSC=/^(?:(\d+): )?(?:(\S+): )?([*.])?([A-Z][a-z]{2})\s+(\d{1,2}) (\d{2}:\d{2}:\d{2})(?:\.(\d{1,3}))?(?: ([A-Za-z]{2,5}))?: %([A-Za-z0-9_]+)-([0-7])-(\S+?): ?(.*)$/;
/* Event keys: interface names, IP addresses, and (only when the event matches one of the
   specific INCIDENT_RULES below, see ruleOf()) a rule key. Events on the same device that
   share a key and are at most WIN ms apart belong to one incident (chained, so later events
   can bridge groups). A shared process name alone is deliberately not a key: two events just
   happen to come from the same daemon (e.g. a firewall's periodic summaries) far too often to
   mean they're related. */
function keys(e){const k=[],ri=ruleOf(e);if(ri>=0)k.push('a:'+ri);(e.msg.match(IFR)||[]).forEach(x=>k.push('i:'+x.replace(/[.:]+$/,'')));(e.msg.match(IFR2)||[]).forEach(x=>k.push('i:'+x));(e.msg.match(IPR)||[]).forEach(x=>{if(x!=='0.0.0.0')k.push('p:'+x)});(e.msg.match(IP6R)||[]).forEach(x=>{if(x!=='::')k.push('p:'+x)});return k}
const SL=['Emergency','Alert','Critical','Error','Warning','Notice','Informational','Debug'],PL=['Emergencies','Alerts','Critical','Errors','Warnings','Notices','Informational','Debug'];
const pl=(n,w)=>n+' '+w+(n===1?'':'s'),N=(es,re)=>es.filter(e=>re.test(e.msg)).length,lst=a=>a.length>2?a.slice(0,-1).join(', ')+', and '+a.at(-1):a.join(' and ');
const topk=(es,p)=>{const c=new Map();es.forEach(e=>keys(e).forEach(k=>{if(k[0]===p)c.set(k,(c.get(k)||0)+1)}));return[...c].sort((a,b)=>b[1]-a[1]).map(x=>x[0].slice(2))};
const bd=(i,hl)=>i.sevs.map(v=>{const n=i.ev.filter(e=>e.sev===v).length,t=n+' '+(n===1?SL[v]:PL[v]);return v===hl?`<b style="color:var(--s${v})">${t}</b>`:t}).join(' · ');
/* Declarative incident-type rules: classify by message/process patterns, then build a title and
   summary from counts. No AI involved. Each rule's match() is run both over a whole candidate
   incident (in describe(), to pick its wording) and, via ruleOf(), over a single event (in
   keys(), so two events that match the same specific rule can be linked even without a shared
   interface or IP). Adding a new tailored incident type means adding one entry here. The last
   entry is the generic fallback: it always matches, but ruleOf() ignores it, since "everything"
   matching the same rule isn't a meaningful link for grouping. */
const INCIDENT_RULES=[
 {name:'bgp',
  match:es=>es.some(e=>/bgp/i.test(e.proc))||N(es,/neighbor \S+ (Up|Down)/)||N(es,/withdrawn|installed via/),
  build:(es,apps,host,n,d,B)=>{
   const peer=topk(es,'p')[0]||'',dn=N(es,/neighbor \S+ Down/),up=N(es,/neighbor \S+ Up\b/),fl=N(es,/attempt .* failed/),loss=N(es,/withdrawn/),rest=N(es,/installed via/),p=[];
   N(es,/keepalive delayed/)&&p.push('delayed keepalives');
   N(es,/hold time expired/)&&p.push('a hold-timer expiry');
   dn&&p.push(`the session going down ${pl(dn,'time')}`);
   fl&&p.push(pl(fl,'failed reconnect attempt'));
   loss&&p.push(rest?'a default-route loss and its restoration':'a default-route loss');
   up&&p.push(`the session re-establishing ${pl(up,'time')}`);
   const kind='BGP disruption',subj=peer&&'peer '+peer;
   return{kind,subj,txt:`${B(host)} logged ${n} related events involving ${peer?'peer '+B(peer):'a BGP neighbour'} over ${d}. The sequence includes ${lst(p)}.`};
  }},
 {name:'ospf',
  match:es=>es.some(e=>/ospf/i.test(e.proc))||N(es,/Nbr \S+ on/),
  build:(es,apps,host,n,d,B)=>{
   const ifc=topk(es,'i')[0]||'',nb=topk(es,'p')[0]||'',dn=N(es,/from FULL to DOWN/),fu=N(es,/to FULL/),ld=N(es,/changed state to down/),dt=N(es,/Dead timer expired/),sp=N(es,/SPF calculation/),p=[];
   ld&&p.push(pl(ld,'link-down event'));
   dn&&p.push(`the adjacency dropping ${pl(dn,'time')}`);
   dt&&p.push(`${dt} dead-timer expir${dt===1?'y':'ies'}`);
   fu&&p.push(`returning to FULL ${pl(fu,'time')}`);
   sp&&p.push(pl(sp,'SPF recalculation'));
   const kind='OSPF adjacency flap',subj=ifc;
   return{kind,subj,txt:`${B(host)} logged ${n} related events on ${ifc?B(ifc):'an OSPF interface'}${nb?' (neighbour '+B(nb)+')':''} over ${d}. The sequence includes ${lst(p)}.`};
  }},
 {name:'auth',
  match:es=>N(es,/Failed password|authentication failure/i)>1,
  build:(es,apps,host,n,d,B)=>{
   const src=topk(es,'p')[0]||'',f=N(es,/Failed password|authentication failure/i),u=[...new Set(es.flatMap(e=>{const m=e.msg.match(/for (?:invalid user )?(\S+) from|user=(\S+)/);return m?[m[1]||m[2]]:[]}))],p=[];
   p.push(`${f} failed logins${u.length?' targeting '+lst(u.map(esc)):''}`);
   N(es,/maximum authentication attempts/)&&p.push('the maximum-attempts limit being hit');
   N(es,/\bBan\b/)&&p.push('the source being banned');
   const kind='Repeated authentication failures',subj=src&&'source '+src;
   return{kind,subj,txt:`${B(host)} logged ${n} related events from ${src?'source '+B(src):'one source'} over ${d}. The sequence includes ${lst(p)}.`};
  }},
 {name:'generic',fallback:true,
  match:()=>true,
  build:(es,apps,host,n,d,B)=>{
   const v=Math.min(...es.map(e=>e.sev));
   const kind=n>1?apps.join(' + ')+' activity':`${es[0].proc}: ${es[0].msg}`;
   return{kind,subj:'',txt:n>1?`${B(host)} logged ${n} related events from ${esc(apps.join(', '))} over ${d}. Highest severity: ${SL[v]}.`:`${B(host)} logged a single ${SL[v]} event.`};
  }}
];
/* Index of the first non-fallback rule a single event matches on its own, or -1. Used only for
   grouping (see keys()); describe() below matches whole candidate groups instead. */
function ruleOf(e){for(let i=0;i<INCIDENT_RULES.length;i++){if(!INCIDENT_RULES[i].fallback&&INCIDENT_RULES[i].match([e]))return i}return-1}
function describe(es,apps){
 const host=es[0].host,d=dur(es.at(-1).t-es[0].t),n=es.length,B=x=>`<b>${esc(x)}</b>`;
 const rule=INCIDENT_RULES.find(r=>r.match(es));
 const{kind,subj,txt}=rule.build(es,apps,host,n,d,B);
 return{kind,subject:subj,title:kind+(subj?' — '+subj:''),summary:txt};
}
function parse(text){
 const ev=[],bad=[];
 text.split(/\r?\n/).forEach(raw=>{

/* UTC/local display toggle. Every timestamp the app *parses* keeps its real instant regardless
   of this setting (RFC 3164 and Cisco lines with no timezone of their own are parsed as local
   time - see CSC/parse() above); this only controls how that instant is *displayed*, in fmt()
   below. Defaults to local; the choice is remembered in localStorage (best-effort, like the
   pane-width persistence above: every access is wrapped in try/catch). */
const TZ_KEY='syslog-lens-tz';
let tz='local';
try{const saved=localStorage.getItem(TZ_KEY);if(saved==='utc')tz='utc'}catch{}
function tzLabel(){
 if(tz==='utc')return'UTC';
 const off=-new Date().getTimezoneOffset(),h=Math.trunc(off/60),mAbs=Math.abs(off)%60;
 return'Local (UTC'+(off>=0?'+':'-')+Math.abs(h)+(mAbs?':'+String(mAbs).padStart(2,'0'):'')+')';
}
function syncTzBtn(){const b=$('#tzbtn');if(b)b.textContent=tzLabel()}
function fmt(d){const o={day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'};if(tz==='utc')o.timeZone='UTC';return d.toLocaleString('en-GB',o)}
function dur(ms){const s=Math.round(ms/1e3);if(s<1)return'0s';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+'h ':'')+(m?m+'m ':'')+(r||!(h||m)?r+'s':'')}
const step=n=>$('#app').dataset.step=n;

function load(text,nm){
 const d=parse(text);
 if(!d.ev.length){$('#err').textContent='No syslog lines could be read. Check that lines start with a timestamp (RFC 3164 or 5424).';return}
 $('#err').textContent='';D=d;name=nm||'pasted log';
 $('#in').hidden=true;$('#app').hidden=false;$('#newb').hidden=false;
 midResize.restore();
 const first=d.by.findIndex(a=>a.length);sel=null;cur=null;
 renderMeta();
 rail();pick(first<0?7:first,true);
}
function renderMeta(){
 $('#meta').innerHTML=`<b>${esc(name)}</b>${D.ev.length} events, ${fmt(D.ev[0].t)} to ${fmt(D.ev.at(-1).t)}${D.bad.length?`<br><button class="chip" id="badb">${D.bad.length} line${D.bad.length>1?'s':''} could not be parsed</button>`:''}`;
 if($('#badb'))$('#badb').onclick=()=>{$('#list').innerHTML='';$('#detail').innerHTML=`<h2>Unparsed lines</h2><p class="cap">These lines did not match RFC 3164 or RFC 5424.</p><ol class="tl" style="--c:var(--s7)">${D.bad.slice(0,200).map(l=>`<li><code>${esc(l)}</code></li>`).join('')}</ol>`;step(3)};
}
function rail(){
 const cnt=D.by.map((_,i)=>D.ev.filter(e=>e.sev===i).length),mx=Math.max(...cnt,1);
 $('#rail').innerHTML=D.by.map((a,i)=>{const n=cnt[i];
  return`<button class="sv" data-s="${i}" style="--c:var(--s${i})" ${n?'':'disabled'} aria-pressed="${i===sel}"><span class="num">${i}</span><span>${SN[i]}</span><span class="ct" title="${a.length} incident(s)">${n}</span><i style="width:calc((100% - 32px)*${n/mx})"></i></button>`}).join('');
}
function pick(i,init){
 sel=i;cur=null;$('#q').value='';rail();list();
 $('#detail').innerHTML='<p class="empty">Select an incident to see its summary and timeline.</p>';
 if(!init)step(2);else step(1);
}
function list(){
 const f=$('#q').value.toLowerCase(),a=D.by[sel].filter(i=>(i.title+i.host).toLowerCase().includes(f));
 $('#list').innerHTML=a.length?a.map(i=>{const k=D.by[sel].indexOf(i);return`<button class="inc" data-i="${k}" data-at="${i.ev.filter(e=>e.sev===sel).length}" data-tot="${i.ev.length}" style="--c:var(--s${sel})" aria-pressed="${k===cur}"><div class="t">${esc(i.title)}</div><div class="m">${esc(i.host)} · ${pl(i.ev.length,"event")} · ${dur(i.ev.at(-1).t-i.ev[0].t)}</div><div class="b">${bd(i,sel)}</div></button>`}).join(''):'<p class="empty">No incidents match. Clear the filter or pick another severity.</p>';
}
function show(k){
 cur=k;list();
 const i=D.by[sel][k],e=i.ev,a=e[0].t,b=e.at(-1).t,span=b-a,B=24,bk=Array(B).fill(0);
 e.forEach(x=>bk[span?Math.min(B-1,Math.floor((x.t-a)/span*B)):0]++);
 const mx=Math.max(...bk);
 $('#detail').style.setProperty('--c',`var(--s${sel})`);
 $('#detail').innerHTML=`<div class="dh"><div><h2>${esc(i.kind)}</h2><div class="sub">${esc(i.host)}${i.subject?' · '+esc(i.subject):''}</div></div><button class="btn tgl" id="tgl" type="button">${Object.values(SEC).some(Boolean)?'Collapse all':'Expand all'}</button></div>
 <details class="sec" data-sec="sum"${SEC.sum?' open':''}><summary>Incident summary</summary><div class="body"><p class="story">${i.summary}</p><p class="note">Generated from the parsed log lines. It describes the events; it is not a diagnosis.</p></div></details>
 <details class="sec" data-sec="ov"${SEC.ov?' open':''}><summary>Event overview</summary><div class="body"><dl class="sum"><div><dt>Events</dt><dd>${e.length}</dd></div><div><dt>First seen</dt><dd>${fmt(a)}</dd></div><div><dt>Last seen</dt><dd>${fmt(b)}</dd></div><div><dt>Duration</dt><dd>${dur(span)}</dd></div><div><dt>Processes</dt><dd>${esc(i.proc)}</dd></div><div class="wide"><dt>Severities</dt><dd>${bd(i,sel)}</dd></div></dl>
 <div class="spark" aria-hidden="true">${bk.map(n=>`<i style="height:${n/mx*100}%;${n?'':'opacity:.15'}"></i>`).join('')}</div><div class="cap">Events over time</div></div></details>
 <details class="sec" data-sec="tl"${SEC.tl?' open':''}><summary>Timeline <span class="cnt">${pl(e.length,'event')}</span></summary><div class="body"><p class="cap">Events at the selected severity are highlighted. Spacing grows with the silence between events.</p>
 <ol class="tl">${e.slice(0,300).map((x,j)=>{const g=j?x.t-e[j-1].t:0,h=j?Math.round(Math.min(96,8+Math.log10(1+g/1e3)*26)):0;
  return`<li style="margin-top:${h}px;--c:var(--s${x.sev})"${x.sev===sel?"":' class="dim"'}>${j?`<span class="gap">+${dur(g)}</span>`:''}<time>${fmt(x.t)}</time><b class="ev">${x.sev} ${SN[x.sev]}</b>${gtag(x)}<p>${esc(x.msg)}</p><details><summary>raw line</summary><code>${esc(x.raw)}</code></details></li>`}).join('')}</ol>
 ${e.length>300?`<p class="cap">Showing the first 300 of ${e.length} events.</p>`:''}</div></details>
 <details class="sec" data-sec="raw"${SEC.raw?' open':''}><summary>Raw event details</summary><div class="body"><pre class="raw">${e.slice(0,300).map(x=>(x.guessed?gtag(x)+' ':'')+esc(x.raw)).join('\n')}</pre></div></details>`;
 step(3);$('#c3').scrollTop=0;
}

/* Resizable divider between incident list (#c2) and detail (#c3). Left rail stays fixed.
   The chosen width is remembered in localStorage (best-effort: storage may be
   unavailable in file:// contexts or with cookies/storage blocked, so every
   access is wrapped in try/catch and the app works the same without it). */
const midResize=(()=>{const app=$('#app'),rz=$('#rz'),c2=$('#c2'),MIN=260,RIGHT=380,LEFT=250,GRIP=10,LS_KEY='syslog-lens-mid';
 const max=()=>Math.max(MIN,app.clientWidth-LEFT-GRIP-RIGHT);
 const save=px=>{try{localStorage.setItem(LS_KEY,String(px))}catch{}};
 const sync=()=>{if(rz.offsetParent===null)return;rz.setAttribute('aria-valuemax',max());rz.setAttribute('aria-valuenow',Math.round(c2.getBoundingClientRect().width))};
 const set=(px,persist)=>{const v=Math.round(Math.min(max(),Math.max(MIN,px)));app.style.setProperty('--mid',v+'px');sync();if(persist)save(v)};
 const end=()=>app.classList.remove('rzing');
 rz.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();rz.setPointerCapture(e.pointerId);app.classList.add('rzing');sync()});
 rz.addEventListener('pointermove',e=>{if(app.classList.contains('rzing'))set(e.clientX-c2.getBoundingClientRect().left-GRIP/2,true)});
 rz.addEventListener('pointerup',end);rz.addEventListener('pointercancel',end);
 rz.addEventListener('focus',sync);addEventListener('resize',sync);
 rz.addEventListener('keydown',e=>{const w=c2.getBoundingClientRect().width,st=e.shiftKey?64:16,m={ArrowLeft:w-st,ArrowRight:w+st,Home:MIN,End:max()}[e.key];if(m!=null){e.preventDefault();set(m,true)}});
 /* Applied once the app pane is visible (see load()), so the min/max clamps
    use real layout widths instead of the hidden pane's zero width. */
 function restore(){let raw=null;try{raw=localStorage.getItem(LS_KEY)}catch{}
  if(raw==null)return;const n=Number(raw);if(!Number.isFinite(n))return;set(n,false)}
 return{restore};
})();

/* Server-backed auth header (signed-in-as + logout). The token itself lives
   only in an httpOnly cookie set by the server — nothing here stores it.
   Deliberately a no-op wherever there's no real server to talk to (file://,
   or the jsdom test loader where fetch is undefined), so it never affects
   existing tests or the file:// usage flow described in README.md. */
(function(){
 if(typeof fetch!=='function')return;
 const whoEl=$('#whoami'),logoutBtn=$('#logoutb');
 async function fetchMe(){
  let res;
  try{res=await fetch('/api/auth/me',{credentials:'same-origin'})}
  catch(e){return null} // no server reachable (e.g. file://) - stay silent
  if(!res||res.status===401)return{unauthorized:res&&res.status===401};
  if(!res.ok)return null;
  try{return await res.json()}catch(e){return null}
 }
 function applyUser(u){
  if(!u||u.unauthorized)return;
  if(whoEl){whoEl.hidden=false;whoEl.textContent=`Signed in as ${u.name} (${u.employeeNumber})`}
  if(logoutBtn)logoutBtn.hidden=false;
 }
 fetchMe().then(u=>{if(u&&u.unauthorized){location.replace('/login');return}applyUser(u)});
 if(logoutBtn)logoutBtn.onclick=async()=>{
  try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch(e){}
  location.replace('/login');
 };
 addEventListener('pageshow',e=>{
  if(!e.persisted)return;
  fetchMe().then(u=>{if(u&&u.unauthorized)location.replace('/login')});
 });
})();
</script>
